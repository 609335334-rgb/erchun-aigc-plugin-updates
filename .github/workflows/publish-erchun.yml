name: Bootstrap release files

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-erchun.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release files
        shell: bash
        run: |
          printf '%s' '' | base64 -d > video_plugin_erchun_aigc-1.1.0.zip
          unzip -p video_plugin_erchun_aigc-1.1.0.zip main.py > main.py
          cat > manifest.json <<'JSON'
          {
            "plugins": [
              {
                "plugin_id": "video_plugin_erchun_aigc",
                "version": "1.1.0",
                "download_url": "https://cdn.jsdelivr.net/gh/609335334-rgb/erchun-aigc-plugin-updates@main/video_plugin_erchun_aigc-1.1.0.zip",
                "sha256": "abeb4e8322aeb755c444f869a42d9c977a1c0700b4c3b29610d702098ab28de5",
                "changelog": "新增贰春账户积分与 Token 额度查询；按模型、清晰度和时长动态预估积分消耗；新增安全自动更新；保留音频素材正确分类与原始 MIME 上传。"
              }
            ]
          }
          JSON
      - name: Commit release files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py manifest.json video_plugin_erchun_aigc-1.1.0.zip
          git diff --cached --quiet || git commit -m 'Publish erchun plugin v1.1.0 [skip ci]'
          git push
